server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso das rotas da API e documentação para o container villarejo-api
    location /api/ {
        proxy_pass http://villarejo-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://villarejo-api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://villarejo-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://villarejo-api:8000/health;
        proxy_set_header Host $host;
    }

    # Serve o Painel Web (SPA / Dashboard)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
