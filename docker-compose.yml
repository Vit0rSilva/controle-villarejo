services:
  villarejo-postgres:
    image: postgres@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: villarejo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - villarejo_pgdata:/var/lib/postgresql/data
    networks:
      - villarejo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  villarejo-api:
    image: controle-villarejo-villarejo-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villarejo-api
    restart: unless-stopped
    depends_on:
      villarejo-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@villarejo-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      EVOLUTION_API_URL: ${DOCKER_EVOLUTION_API_URL:?DOCKER_EVOLUTION_API_URL is required}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:?EVOLUTION_INSTANCE_NAME is required}
      EVOLUTION_INSTANCE_TOKEN: ${EVOLUTION_INSTANCE_TOKEN:?EVOLUTION_INSTANCE_TOKEN is required}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:?EVOLUTION_WEBHOOK_TOKEN is required}
      REQUIRE_WEBHOOK_TOKEN: ${REQUIRE_WEBHOOK_TOKEN:-true}
      TARGET_GROUP_JID: ${TARGET_GROUP_JID:?TARGET_GROUP_JID is required}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:?WEBHOOK_PUBLIC_URL is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      STALE_SECTION_HOURS: ${STALE_SECTION_HOURS:-24}
      FUZZY_MATCH_THRESHOLD: ${FUZZY_MATCH_THRESHOLD:-82}
      AUTO_SEED_ON_STARTUP: ${AUTO_SEED_ON_STARTUP:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - villarejo_network
      - evolution_external_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 384m

  villarejo-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: villarejo-frontend
    restart: unless-stopped
    depends_on:
      - villarejo-api
    environment:
      API_BACKEND_URL: http://villarejo-api:8000
      VILLAREJO_ADMIN_USERNAME: ${VILLAREJO_ADMIN_USERNAME:?VILLAREJO_ADMIN_USERNAME is required}
      VILLAREJO_ADMIN_PASSWORD_HASH: ${VILLAREJO_ADMIN_PASSWORD_HASH:?VILLAREJO_ADMIN_PASSWORD_HASH is required}
      VILLAREJO_AUTH_SECRET: ${VILLAREJO_AUTH_SECRET:?VILLAREJO_AUTH_SECRET is required}
      VILLAREJO_SESSION_TTL_SECONDS: ${VILLAREJO_SESSION_TTL_SECONDS:-28800}
    networks:
      - villarejo_network
      - evolution_external_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 192m

volumes:
  villarejo_pgdata:
    name: villarejo_pgdata

networks:
  villarejo_network:
    name: villarejo_network
    driver: bridge
  evolution_external_net:
    name: meu-servidor_backend
    external: true
